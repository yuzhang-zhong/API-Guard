<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">API Guard credential flow</title><desc id="desc">Conceptual diagram. A hidden input stores a credential in the operating system vault. The run command retrieves it into the environment of a trusted child process. No plaintext fallback is provided; the child process can still expose the value.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d182b"/><stop offset="1" stop-color="#13283c"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6dd9bf" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="430" rx="24" fill="url(#bg)"/>
<g font-family="Arial, sans-serif"><text x="48" y="51" fill="#6dd9bf" font-size="14" font-weight="700" letter-spacing="3">API GUARD / CREDENTIAL FLOW</text><text x="48" y="100" fill="#f1f7ff" font-size="32" font-weight="700">Store once. Inject only when needed.</text><text x="48" y="132" fill="#adc0d5" font-size="17">A small local workflow, not a security sandbox.</text>
<g fill="#162b40" stroke="#355169"><rect x="48" y="179" width="290" height="143" rx="16"/><rect x="455" y="179" width="290" height="143" rx="16"/><rect x="862" y="179" width="290" height="143" rx="16"/></g>
<g fill="#6dd9bf" font-size="13" font-weight="700" letter-spacing="2"><text x="70" y="208">01 / STORE</text><text x="477" y="208">02 / KEEP</text><text x="884" y="208">03 / RUN</text></g>
<g fill="#ffffff" font-size="23" font-weight="700"><text x="70" y="247">Hidden input</text><text x="477" y="247">OS credential vault</text><text x="884" y="247">Trusted child process</text></g>
<g fill="#b8c9da" font-size="15"><text x="70" y="278">Name the credential, not the secret.</text><text x="477" y="278">Windows · macOS · Linux</text><text x="884" y="278">Read through an environment variable.</text></g>
<path d="M351 251H439" stroke="#6dd9bf" stroke-width="2" marker-end="url(#arrow)"/><path d="M758 251H846" stroke="#6dd9bf" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="373" fill="#c4d3e2" font-size="16">Masked reads by default</text><circle cx="299" cy="368" r="3" fill="#6dd9bf"/><text x="320" y="373" fill="#c4d3e2" font-size="16">No plaintext file fallback</text><circle cx="584" cy="368" r="3" fill="#6dd9bf"/><text x="605" y="373" fill="#c4d3e2" font-size="16">Process and host trust still matter</text>
<text x="48" y="405" fill="#8298ad" font-size="12">CONCEPTUAL DIAGRAM · NOT A PRODUCT SCREENSHOT</text></g></svg>